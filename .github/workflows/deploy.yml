name: Deploy

# Every push to main builds the app, applies database migrations, and deploys to Cloudflare.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Use the account's "meal-planner" database, creating it on the first deploy.
      - name: Find or create database
        run: |
          find_db() { npx wrangler d1 list --json | jq -r '.[] | select(.name == "meal-planner") | .uuid'; }
          id=$(find_db)
          if [ -z "$id" ]; then
            npx wrangler d1 create meal-planner --update-config=false
            id=$(find_db)
          fi
          test -n "$id"
          sed -i -E "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$id\"/" wrangler.jsonc
          echo "Using database $id"

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply meal-planner --remote

      - name: Deploy worker
        run: npx wrangler deploy
